[mod]
name = Teleport to Waypoint
author = 00xJS
version = 0.1
description = Set a waypoint on the pause map and you are taken straight there instead of driving. The car you sit in and your homies come along. Key 8 also takes you to your own (green) waypoint; a mission's blue one is never used.\n\nYou land on the highest surface at the spot you picked: street, rooftop or dome. Single player only. Works on the Windows and the Mac build (the on-screen position readout is Windows only).

[settings]
; Teleport whenever a waypoint is set on the pause map (A / left click on the map).
teleport_on_map_waypoint = true
; ---- Keys (while playing; "" = none) ----
; Keys are letters, digits or F1-F12. The defaults are number keys because on a Mac keyboard the F-keys are
; brightness and volume unless Fn is held; 8 and 9 work the same on Windows and Mac.
; Teleports to your own (green) map waypoint. A mission's blue waypoint is never used.
teleport_key = 8
; Toggles the position readout: your x, y, z in the corner of the screen (Windows, coords.dll) and in mods/wml.log
; once a second while on, for naming a spot that misbehaves.
coords_key = 9
; Close the pause map by itself after a waypoint is set, so the move starts at once (the map pauses the game).
close_map = true
; If the route's road point can't be read, hang in the air over the spot and probe for the ground instead
; (off: stay where you are). Unreliable: the world only streams in near the player, so leave this off.
hover_fallback = false
; Height for that fallback, in metres.
hover_height = 220
; Longest wait for the ground to load before the player is simply let down, in seconds.
timeout_seconds = 12
; Show "Teleported to the waypoint" and similar notes on the HUD.
hud_messages = true
; How long those notes stay, in seconds.
hud_seconds = 3
; Write every step (positions, probe results, timing) to mods/wml.log. Off by default; turn on to report a problem.
debug = false
